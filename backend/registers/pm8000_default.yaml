  - name: "thd_current_c"
    address: 27378
    type: "float32"
    unit: "%"
    phase: "c"
    category: "thd"
    description: "THD Corriente Fase C"

  # ─── Demand ───
  - name: "demand_active_power"
    address: 3183
    type: "float32"
    unit: "W"
    phase: "total"
    category: "demand"
    description: "Demanda Potencia Activa"

  - name: "demand_reactive_power"
