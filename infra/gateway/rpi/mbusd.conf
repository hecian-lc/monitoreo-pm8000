# mbusd configuration for Schneider Electric PM8000
#
# Adjust serial port and baud rate to match your PM8000 settings.
# PM8000 defaults: 19200 baud, even parity, 1 stop bit
#
# Verify PM8000 communication settings at:
#   Menu > Setup > Communications > Modbus > Serial Port

# Serial port (RS-485 adapter connected to PM8000)
device = /dev/ttyUSB0
speed = 19200
parity = even
stopbits = 1

# TCP server settings
# Clients (backend) connect to this port via Modbus TCP
bind = 0.0.0.0
port = 502
maxconn = 4
timeout = 3

# Logging (0=none, 1=errors, 2=warnings, 3=info, 4=debug)
loglevel = 2
logfile = /var/log/mbusd.log
