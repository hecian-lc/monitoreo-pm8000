[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    emelianov/modbus-esp8266@^4.1
    bblanchon/ArduinoJson@^7.0

; WiFi credentials (override via build_flags or wifi_manager)
build_flags =
    -DWIFI_SSID=\"\"
    -DWIFI_PASSWORD=\"\"
    -DMODBUS_TCP_PORT=502
    -DRS485_BAUD=19200
    -DRS485_RX=16
    -DRS485_TX=17
    -DRS485_DE=4
