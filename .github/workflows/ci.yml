# CI con los workflows reutilizables de hecian-lc/.github.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: hecian-lc/.github/.github/workflows/ci-node.yml@v1
    with:
      directorio: frontend

  # Python 3.11, como el Dockerfile del backend.
  backend:
    uses: hecian-lc/.github/.github/workflows/ci-python.yml@v1
    with:
      directorio: backend
      python: '3.11'

  # gitleaks sobre todo el historial y npm audit de producción (high+).
  seguridad:
    uses: hecian-lc/.github/.github/workflows/seguridad.yml@v1
    with:
      auditar_npm: |
        frontend

  # Control de marca y licencia: falla si falta algo del estándar.
  marca:
    uses: hecian-lc/.github/.github/workflows/marca.yml@v1
    with:
      estricto: true
